<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Express Pick-Up — выдача</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8590c'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header id="topbar"></header>
<main class="wrap-wide">
  <div class="row-between" style="margin:18px 0 14px;flex-wrap:wrap;gap:10px">
    <div>
      <h1 style="margin:0" data-i18n="pickup.h"></h1>
      <div class="small muted" id="pointLine"></div>
    </div>
    <div class="row" style="gap:10px">
      <span class="badge badge-ok"><span class="dot pulse"></span><span data-i18n="common.live"></span></span>
      <span class="badge num" id="clock"></span>
      <select id="venueSelect" style="max-width:230px"></select>
    </div>
  </div>

  <div class="board">
    <section>
      <div class="board-codes" id="readyList"></div>
      <div class="empty hidden" id="readyEmpty" data-i18n="pickup.none"></div>
    </section>
    <aside>
      <div class="card">
        <h3 data-i18n="pickup.cooking"></h3>
        <div class="stack" id="cookingList" style="gap:6px"></div>
      </div>
      <div class="card">
        <h3 data-i18n="pickup.recent"></h3>
        <div class="stack" id="recentList" style="gap:4px"></div>
      </div>
    </aside>
  </div>
</main>
<script src="/assets/i18n.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/pickup.js"></script>
</body>
</html>
