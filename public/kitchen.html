<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Express Pick-Up — кухня</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8590c'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header id="topbar"></header>
<main class="wrap-wide">
  <div class="row-between" style="margin:18px 0 6px;flex-wrap:wrap;gap:10px">
    <div>
      <h1 style="margin:0" data-i18n="kitchen.h"></h1>
      <div class="small muted" id="venueLine"></div>
    </div>
    <div class="row" style="gap:10px">
      <span class="badge badge-ok" id="liveBadge"><span class="dot pulse"></span><span data-i18n="common.live"></span></span>
      <span class="badge num" id="clock"></span>
      <select id="venueSelect" style="max-width:230px"></select>
    </div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <div class="row-between">
      <h3 style="margin:0" data-i18n="kitchen.forecast"></h3>
      <span class="tiny faint" id="capacityNote"></span>
    </div>
    <p class="tiny faint" style="margin:2px 0 8px" data-i18n="kitchen.forecastDesc"></p>
    <div id="forecast" class="row" style="gap:4px;align-items:flex-end"></div>
    <div class="row" style="gap:14px;margin-top:8px;flex-wrap:wrap">
      <span class="row tiny" style="gap:5px"><i style="width:9px;height:9px;border-radius:2px;background:var(--ok);display:block"></i><span data-i18n="kitchen.channelExpress"></span></span>
      <span class="row tiny" style="gap:5px"><i style="width:9px;height:9px;border-radius:2px;background:var(--border-strong);display:block"></i><span data-i18n="kitchen.channelCounter"></span></span>
      <span class="row tiny" style="gap:5px"><i style="width:14px;border-top:1px dashed var(--brand);display:block"></i><span data-i18n="kitchen.reserved"></span></span>
    </div>
  </div>

  <div class="row-between" style="margin-bottom:8px">
    <h2 style="margin:0" data-i18n="kitchen.queue"></h2>
    <span class="badge" id="queueCount"></span>
  </div>
  <div class="kds" id="queue"></div>
  <div class="empty hidden" id="queueEmpty" data-i18n="kitchen.empty"></div>
</main>
<script src="/assets/i18n.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/kitchen.js"></script>
</body>
</html>
