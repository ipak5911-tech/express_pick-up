<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Express Pick-Up — о проекте</title>
<meta name="description" content="Предзаказ еды к точному времени в Алматы: слоты с реальной производственной ёмкостью кухни и отдельная точка выдачи.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8590c'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header id="topbar"></header>
<main class="wrap">

  <h1 data-i18n="about.h1"></h1>
  <p class="lede" data-i18n="about.lede"></p>

  <div class="grid grid-2" style="margin-bottom:22px">
    <a class="btn btn-primary btn-lg" href="/" data-i18n="about.tryGuest"></a>
    <a class="btn btn-lg" href="/kitchen" data-i18n="about.tryKitchen"></a>
    <a class="btn btn-lg" href="/pickup" data-i18n="about.tryPickup"></a>
    <a class="btn btn-lg" href="/admin" data-i18n="about.tryAdmin"></a>
  </div>
  <p class="tiny faint" style="margin:-12px 0 24px" id="pinHint"></p>

  <h2 data-i18n="about.problemH"></h2>
  <div class="card">
    <p style="margin-top:0" data-i18n="about.problemBody"></p>
    <div class="grid grid-3" style="margin-top:14px">
      <div class="kpi"><div class="kpi-label" data-i18n="about.stat1Label"></div><div class="kpi-value">47%</div><div class="kpi-sub" data-i18n="about.stat1Sub"></div></div>
      <div class="kpi"><div class="kpi-label" data-i18n="about.stat2Label"></div><div class="kpi-value">20 → 2</div><div class="kpi-sub" data-i18n="about.stat2Sub"></div></div>
      <div class="kpi"><div class="kpi-label" data-i18n="about.stat3Label"></div><div class="kpi-value">+25%</div><div class="kpi-sub" data-i18n="about.stat3Sub"></div></div>
    </div>
  </div>

  <h2 data-i18n="about.solutionH"></h2>
  <div class="card">
    <table class="tbl">
      <thead><tr><th data-i18n="about.colProblem"></th><th data-i18n="about.colSolution"></th></tr></thead>
      <tbody id="solutionTable"></tbody>
    </table>
  </div>

  <h2 data-i18n="about.engineH"></h2>
  <div class="card">
    <p class="small muted" style="margin-top:0" data-i18n="about.engineBody"></p>
    <div id="engineDiagram" style="margin:16px 0"></div>
    <p class="small muted" style="margin-bottom:0" data-i18n="about.engineNote"></p>
  </div>

  <h2 data-i18n="about.trafficH"></h2>
  <div class="card">
    <p class="small muted" style="margin-top:0" data-i18n="about.trafficBody"></p>
    <div id="trafficChart" style="margin-top:14px"></div>
    <p class="tiny faint" style="margin-bottom:0" data-i18n="about.trafficNote"></p>
  </div>

  <h2 data-i18n="about.liveH"></h2>
  <p class="small muted" style="margin-top:-4px" data-i18n="about.liveDesc"></p>
  <div class="grid grid-3" id="liveKpi"></div>
  <div class="card" style="margin-top:12px">
    <table class="tbl">
      <thead><tr>
        <th data-i18n="common.venue"></th>
        <th data-i18n="about.colWait"></th>
        <th data-i18n="about.colOnTime"></th>
        <th data-i18n="about.colGain"></th>
      </tr></thead>
      <tbody id="venueTable"></tbody>
    </table>
  </div>

  <div class="card" style="border-color:var(--warn);background:var(--warn-soft);margin-top:22px">
    <b data-i18n="about.brandsH"></b>
    <p class="small" style="margin:6px 0 0" data-i18n="about.brandsBody"></p>
  </div>

  <h2 data-i18n="about.honestH"></h2>
  <div class="card">
    <p class="small" style="margin-top:0" data-i18n="about.honestIntro"></p>
    <ul class="small muted" id="honestList" style="margin:10px 0 0;padding-left:20px"></ul>
  </div>

</main>
<script src="/assets/i18n.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/about.js"></script>
</body>
</html>
